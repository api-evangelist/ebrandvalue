aid: ebrandvalue
name: Ebrandvalue
description: >-
  eBrandValue is a brand intelligence and social media analytics platform that
  converts real-time social data into actionable marketing metrics. It measures
  brand mindshare, tracks competitive market-share fluctuations, predicts sales
  weeks in advance, surfaces influencers and effective marketing tactics, and
  provides crisis and reputation support. The product is delivered as a SaaS
  web dashboard with one-click export of data and visualizations for reports
  and presentations. eBrandValue does not currently publish a public developer
  API, OpenAPI specification, or client SDKs; access is through the hosted
  application. Clients include major consumer brands and financial institutions.
